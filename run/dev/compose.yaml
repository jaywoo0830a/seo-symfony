name: seo-symfony-dev

x-uid: &uid ${UID:-1000}
x-gid: &gid ${GID:-1000}

services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../..:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app

  php:
    build:
      context: ../..
      dockerfile: run/dev/Dockerfile.php
      args:
        UID: *uid
        GID: *gid
    image: seo-symfony/php:dev
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-dev_secret_not_for_production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MAILER_DSN: smtp://mailer:1025
      DEFAULT_URI: http://localhost:${HTTP_PORT:-8080}
    volumes:
      - ../..:/var/www/html
      - composer_cache:/home/app/.composer
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app

  node:
    image: node:24-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install --no-audit --no-fund && npm run watch"
    volumes:
      - ../..:/app
    networks:
      - app

  database:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app
    volumes:
      - database_data:/var/lib/postgresql/data

  mailer:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - app

volumes:
  database_data:
  composer_cache:

networks:
  app:
