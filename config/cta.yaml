# CTA 매핑 테이블 — 슬롯 × BodyTemplate → Cta 정의.
# 운영자는 만지지 않음. 사업 정책 결정 시 개발자가 편집.
#
# 슬롯:
#   navbar : layout 상단 바 (페이지 컨텍스트 없음, 항상 글로벌)
#   hero   : 페이지 상단 큰 영역 (단일 버튼)
#   final  : 페이지 하단 마무리 영역 (전체 블록 — 폼 임베드 가능)
#
# 룰 매칭:
#   match에 fnmatch 패턴 사용. 'guide' 같은 정확 일치, 와일드카드도 가능.
#   첫 매칭 룰이 채택됨 (위에서 아래로 평가).
#   '*' 는 모든 BodyTemplate에 매치 (안전망).
#
# 라벨/assurance/hint는 *플레이스홀더*입니다. 자신의 도메인에 맞게 교체하세요.

parameters:
  cta.config:
    ctas:
      brand_phone:
        type: phone
        label: '지금 문의하기'
        payload:
          phone: '%env(BRAND_PHONE)%'
        hint: '%env(BRAND_PHONE_HOURS)%'
        assurances:
          - '문의 무료'
          - '평일 24시간 내 회신'

      guide_consult_form:
        type: form
        label: '상담 요청'
        payload:
          form: consult
        hint: '평일 24시간 내 회신'
        assurances:
          - '문의 무료'
          - '익명 문의 가능'
          - '개인정보는 즉시 파기'

    slots:
      navbar:
        - { match: '*', cta: brand_phone }

      hero:
        - { match: 'guide', cta: guide_consult_form }
        - { match: '*',     cta: brand_phone }

      final:
        - { match: 'guide', cta: guide_consult_form }
        - { match: '*',     cta: brand_phone }
