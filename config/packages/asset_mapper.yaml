framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        # SCSS sources are compiled by `sass` (npm) into assets/styles/app.css.
        # AssetMapper should not serve the .scss files themselves.
        excluded_patterns:
            - '*/assets/scss/*'
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
