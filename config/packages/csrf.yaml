# CSRF protection.
#
# All tokens are stateful (session-based) so forms work without JavaScript —
# the dashboard is no-JS by design and the login form is the same.
#
# The stateless double-submit-cookie strategy ships with Symfony 8 webapp but
# requires the JS controller in assets/controllers/csrf_protection_controller.js
# to populate the token at submit time, which we do not load on dashboard pages.
framework:
    csrf_protection:
        stateless_token_ids: []
