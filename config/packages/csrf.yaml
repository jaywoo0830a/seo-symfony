# CSRF protection.
#
# Forms use stateful (session-based) tokens so they work without JavaScript —
# our admin dashboard is no-JS by design.
#
# Login/logout endpoints keep the stateless double-submit-cookie strategy
# (the JS controller in assets/controllers/csrf_protection_controller.js
# only runs when Stimulus is loaded; it is harmless when absent).
framework:
    csrf_protection:
        stateless_token_ids:
            - authenticate
            - logout
